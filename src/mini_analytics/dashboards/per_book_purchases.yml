id: per_book_purchases
title: Per-Book Purchase Rate
description: For each book, what share of its issued tokens have actually been purchased? Where do the long-tail titles sit?

blocks:
  # --- Context ------------------------------------------------------------
  - id: note_per_book_semantics
    type: note
    title: This is not retail sell-through
    body: |
      Each **token is one numbered digital copy** of a book, issued before checkout runs. A book's "purchase rate" here means **tokens purchased ÷ tokens issued**, not retail sell-through. A low rate can mean: the book is unlimited-supply (the author keeps issuing copies, with no target), the book is limited-supply and still selling, or some mix of abandoned checkouts, payment declines and recording errors.

      Treat this dashboard as a **triage view** for identifying books that warrant a closer look, not a performance grade.

  # --- KPIs ---------------------------------------------------------------
  - id: kpi_books_with_tokens
    type: kpi
    title: Books with issued tokens
    format: integer
    sql: SELECT COUNT(*) AS value FROM dim_book WHERE token_count > 0

  - id: kpi_fully_purchased
    type: kpi
    title: Books fully purchased
    format: integer
    subtitle: tokens_purchased = tokens_issued (and > 0)
    sql: |
      SELECT COUNT(*) AS value
      FROM dim_book
      WHERE token_count > 0 AND tokens_sold = token_count

  - id: kpi_zero_purchases
    type: kpi
    title: Books with zero purchases
    format: integer
    subtitle: Has issued tokens, none purchased yet
    sql: |
      SELECT COUNT(*) AS value
      FROM dim_book
      WHERE token_count > 0 AND tokens_sold = 0

  - id: kpi_avg_purchase_rate
    type: kpi
    title: Avg purchase rate
    format: percent
    subtitle: Averaged across books that have issued tokens
    sql: |
      SELECT AVG(tokens_sold::DOUBLE / token_count) AS value
      FROM dim_book
      WHERE token_count > 0

  # --- Charts -------------------------------------------------------------
  - id: purchase_rate_histogram
    type: histogram
    title: Purchase rate by book
    description: Distribution of `tokens_purchased ÷ tokens_issued` across the catalog. A mass at 0% is books with issued tokens but no purchases; mass at 100% is books whose issued tokens have all been purchased.
    format: percent
    x: purchase_rate
    nbins: 25
    wide: true
    sql: |
      SELECT tokens_sold::DOUBLE / token_count AS purchase_rate
      FROM dim_book
      WHERE token_count > 0

  - id: purchase_rate_buckets
    type: bar
    title: Books per purchase-rate bucket
    description: Same data as the histogram, bucketed into business-friendly ranges.
    format: integer
    x: bucket
    y: books
    sql: |
      WITH b AS (
        SELECT
          CASE
            WHEN tokens_sold = 0                                  THEN '0% (no purchases)'
            WHEN tokens_sold::DOUBLE / token_count < 0.25         THEN '1–24%'
            WHEN tokens_sold::DOUBLE / token_count < 0.50         THEN '25–49%'
            WHEN tokens_sold::DOUBLE / token_count < 0.75         THEN '50–74%'
            WHEN tokens_sold::DOUBLE / token_count < 1.00         THEN '75–99%'
            ELSE                                                        '100% (fully purchased)'
          END AS bucket,
          CASE
            WHEN tokens_sold = 0 THEN 0
            WHEN tokens_sold::DOUBLE / token_count < 0.25 THEN 1
            WHEN tokens_sold::DOUBLE / token_count < 0.50 THEN 2
            WHEN tokens_sold::DOUBLE / token_count < 0.75 THEN 3
            WHEN tokens_sold::DOUBLE / token_count < 1.00 THEN 4
            ELSE 5
          END AS ord
        FROM dim_book
        WHERE token_count > 0
      )
      SELECT bucket, COUNT(*) AS books
      FROM b
      GROUP BY bucket, ord
      ORDER BY ord

  - id: top_fully_purchased
    type: table
    title: Fully-purchased books, by issue size
    description: Books whose every issued token has been purchased. Largest issue first — bigger issued tokens reaching 100% is a stronger signal than a single-token book going to 100%.
    sql: |
      SELECT
        COALESCE(b.title, '(untitled)')                          AS book,
        COALESCE(a.name,  '(unknown)')                           AS author,
        b.token_count                                            AS tokens_issued,
        b.tokens_sold                                            AS tokens_purchased,
        ROUND(b.gmv_cents / 100.0, 2)                            AS gmv_usd
      FROM dim_book b
      LEFT JOIN dim_author a ON a.id = b.author_id
      WHERE b.token_count > 0 AND b.tokens_sold = b.token_count
      ORDER BY b.token_count DESC, b.gmv_cents DESC
      LIMIT 20

  - id: zero_purchase_books
    type: table
    title: Books with issued tokens but no purchases (largest first)
    description: Books with the most issued tokens and no completed purchases. Triage list — could be an unlimited-supply book recently issued, a pricing issue, or a checkout problem.
    sql: |
      SELECT
        COALESCE(b.title, '(untitled)')                          AS book,
        COALESCE(a.name,  '(unknown)')                           AS author,
        b.token_count                                            AS tokens_issued
      FROM dim_book b
      LEFT JOIN dim_author a ON a.id = b.author_id
      WHERE b.token_count > 0 AND b.tokens_sold = 0
      ORDER BY b.token_count DESC
      LIMIT 20
