[project]
name = "mini-analytics"
version = "0.1.0"
description = "Static, SQL-first dashboards from CSV exports — a lightweight Metabase alternative"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "plotly>=5.20",
    "jinja2>=3.1",
    "pandas>=2.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "moto[s3]>=5.0",
]

[project.scripts]
mini-analytics = "mini_analytics.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mini_analytics = ["models/*.sql", "rendering/templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
